notes: |
  This task is the bridge from "experiment done" to "in the paper". Output the
  three artefacts and stop — do NOT touch main.tex. The orchestrator will pull
  them in.

  Coding env: any Python + matplotlib + numpy is fine. If the AIE arm power
  number is unavailable from aiesimulator (typical), document "AIE power
  estimate via vcd_to_power post-pass" as future work and emit "—" in the
  table cell; do NOT fabricate.
