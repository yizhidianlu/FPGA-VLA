type: vivado_pnr
priority: P0
supersedes: T0050
target_worker: remote_claude_ali_aie
depends_on: [T0050]
deadline_minutes: 120
params:
  module_name: mr_vla_full_top_v7_150mhz_repio
  description: |
    **150 MHz re-impl with REPRESENTATIVE on-chip I/O budget — obtain the
    WNS>=0 [HW-IMPL] closure number for the TCAD paper.**

    T0050 A1 gave WNS=-0.293 ns @150 MHz under a 2.0 ns EXTERNAL output_delay.
    Diagnosis (T0050 result.json): core logic on the critical path is only
    0.642 ns; the gap is (a) OOC clock skew 4.254 ns and (b) the 2.0 ns
    output_delay on the m_axi master ports. Those ports are externalized as
    IOBs ONLY because of OOC mode; in the deployed Vitis platform they route
    to the integrated NoC (on-chip), where ~0.5 ns is the representative
    interface budget. This re-run uses that representative budget. Reducing
    output_delay 2.0->0.5 frees ~1.5 ns directly on the binding path, so
    WNS should move from -0.293 to comfortably positive.

  quickstart_for_resumed_session: |
    cd /tools/projects/FPGA-VLA
    source /tools/Xilinx/Vivado/2024.1/settings64.sh
    mkdir -p runs/T0050_v2 && cd runs/T0050_v2
    cat > mr_vla_bd_v7_repio.xdc <<'XDC'
    create_clock -name clk_in -period 6.667 [get_ports clk_in]
    # Representative ON-CHIP (NoC-internal) I/O budget: AXI masters route to
    # the integrated NoC in the deployed platform, NOT to off-chip IOBs.
    set_input_delay  -clock clk_in -max 0.5 [all_inputs]
    set_input_delay  -clock clk_in -min 0.1 [all_inputs]
    set_output_delay -clock clk_in -max 0.5 [all_outputs]
    set_output_delay -clock clk_in -min 0.1 [all_outputs]
    XDC
    vivado -mode batch -nolog -nojournal -source <(cat <<'TCL'
    open_checkpoint runs/T0050/impl_150mhz_A1.dcp
    # if the A1 dcp is post-route, instead reopen the synth dcp:
    # open_checkpoint runs/T0036_v5/synth_ooc.dcp  (then read synth, not impl)
    read_xdc runs/T0050_v2/mr_vla_bd_v7_repio.xdc
    opt_design
    place_design
    phys_opt_design
    route_design
    phys_opt_design
    report_timing_summary -file runs/T0050_v2/impl_timing_150mhz_repio.rpt
    report_utilization     -file runs/T0050_v2/impl_util_150mhz_repio.rpt
    report_power           -file runs/T0050_v2/impl_power_150mhz_repio.rpt
    write_checkpoint -force runs/T0050_v2/impl_150mhz_repio.dcp
    exit
    TCL
    )
    # NOTE: if reopening the A1 post-route dcp + re-constraining does not take,
    # restart cleanly from runs/T0036_v5/synth_ooc.dcp (synth output), apply the
    # repio XDC, and run opt->place->phys_opt->route->phys_opt fresh.
    WNS=$(grep -A2 "Design Timing Summary" runs/T0050_v2/impl_timing_150mhz_repio.rpt | grep -oE '\-?[0-9]+\.[0-9]+' | head -1)
    echo "T0050_v2 WNS @150MHz (representative I/O) = $WNS"
    mkdir -p /tools/projects/FPGA-VLA/coord/reports/T0050_v2
    cp -p runs/T0050_v2/impl_*_150mhz_repio.rpt /tools/projects/FPGA-VLA/coord/reports/T0050_v2/
    # write result.json (wns/whs/fmax/power dyn+static) + inbox DONE (hyphen ts)

  target_part: xcvc1902-vsva2197-2MP-e-S
  clock_period_ns: 6.667
acceptance_criteria:
  - status: "== DONE"
  - result.impl_ok: true
  - result.wns_ns: ">= 0"
  - result.io_budget_ns: "== 0.5"
  - result.total_power_w: "< 20"
human_ack_required_on:
  - wns_still_below_0_after_repio   # would mean a real (non-I/O) path binds; report it
  - vivado_crash
notes: |
  Output for paper: positive-WNS [HW-IMPL] at 150 MHz under the representative
  on-chip I/O budget. The paper will report BOTH: (i) this 150 MHz / WNS>=0
  representative-budget number as the headline integrated closure, and
  (ii) T0050's conservative external-budget bound (143.7 MHz @ 2.0 ns
  output_delay) as the worst-case, with the I/O-budget rationale stated
  honestly (NoC-internal masters, OOC clock-skew artifact). Report P_dyn@150
  separately for the B1 J/step recompute (~2.3-2.4 W expected).

  Do NOT pipeline u_sched (A2 hypothesis retired by T0050 diagnosis).
