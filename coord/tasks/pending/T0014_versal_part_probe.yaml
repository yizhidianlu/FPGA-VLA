notes: |
  Verify the actual Vitis HLS installation supports the Versal VCK190 part
  (xcvc1902-vsva2197-2MP-e-S). Run `vitis_hls -help_part <part>` for each
  candidate; record which parts are recognized.

  Critical: T0011 noted "Tools in Vitis_HLS\bin and Vivado\bin, not unified
  Vitis\bin" — suggests standalone HLS+Vivado install, not the bundled Vitis
  installer. The Versal device support files may be in a separate Xilinx
  install component (Vivado Design Suite — Devices — Versal).

  Result.json should include:
    versal_part_supported: bool                  (xcvc1902 specifically)
    supported_parts:       [list of parts that were recognized]
    unsupported_parts:     [list with reason]
    install_diagnosis:     string                (e.g., "Vivado has UltraScale+ only; Versal not installed")
    recommended_target:    string                (the best part we can actually target)

  If Versal is NOT supported, recommend ZCU102 as fallback target for all
  subsequent tasks. We can still demonstrate the architecture concepts
  (multi-rate scheduling, cross-modal sparse attention) on ZCU102, even
  though VCK190 is the eventual deployment target.
