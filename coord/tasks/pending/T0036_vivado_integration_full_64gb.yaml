  - lut_pct_above_15
  - impl_skipped_synth_only
notes: |
  This is the single most important hardware deliverable for camera-ready.
  Worker: please prepend stdout with `free -g` and `vivado -version` so the
  orch can immediately verify the host capacity at write-time.

  If Vivado crashes AGAIN despite 64 GB: do NOT fall back to DCP linking
  (already shown non-functional in T0032). Instead, capture the crash log,
  write inbox FAIL with verb=host_unexpectedly_limited, and stop.

  Cross-paper alignment: the result.json must surface a single integrated
  resource line (dsp / lut / bram_tiles / uram + dsp_pct ... + wns_ns +
  total_power_w) — that line goes verbatim into main.tex Table V as the
  HW-SYNTH integrated row.
