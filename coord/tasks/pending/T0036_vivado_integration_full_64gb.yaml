  - status: "== DONE"
  - result.synth_ok: true
  - result.impl_ok: true
  - result.timing_met: true
  - result.wns_ns: ">= 0"
  - result.lut_pct: "< 25"
  - result.dsp_pct: "< 25"
  - result.bram_pct: "< 30"
  - result.uram_pct: "< 25"
