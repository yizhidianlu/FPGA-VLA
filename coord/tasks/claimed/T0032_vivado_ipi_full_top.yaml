task_id: T0032
created_by: orchestrator
created_at: 2026-05-20T03:05:00Z
type: vivado_ipi
priority: P0
supersedes: T0031
depends_on: [T0024, T0025, T0026, T0029, T0030]
deadline_minutes: 420
params:
  module_name: mr_vla_full_top
  description: |
    **T0031 redo via the official Vitis HLS export_design + Vivado
    IP-Integrator flow.** The T0031 v0 single-shot co-synth crashed Vivado 3x
    (EXCEPTION_BREAKPOINT on thousands of dangling ap_memory ports) because raw
    HLS-generated RTL was hand-instantiated into a parent netlist. This task
    uses the SUPPORTED flow instead, where ap_memory / ap_ctrl / ap_fifo
    interfaces get proper IP-Integrator adapters and the softmax divider
    LogiCORE is regenerated by the tool inside each packaged IP.

    Orchestrator decision: official IP-Integrator flow (not the bottom-up DCP
    alternative). Produces a REAL integrated post-synth (and post-route if time
    permits) netlist — upgrades paper Table V system-total row from a
    sum-of-components projection to a measured integrated number.

  flow:
    step_1_export_each_hls_ip: |
      In Vitis HLS 2024.1, re-open each HLS solution and run
      `export_design -format ip_catalog -rtl verilog`. This packages each IP
      as IP-XACT with interface adapters AND bundles the divider LogiCORE.
      IPs to export:
        - xmod_attn_v1      (from T0024 reports/source)
        - gvsa_matmul       (from T0025 reports/source)
        - action_diff_head  (from T0026 reports/source)
        - vit_encoder_12layer (from T0029 reports/source)
      Collect the four packaged-IP .zip / repo directories.
    step_2_rtl_ip_for_scheduler: |
      multi_rate_scheduler (T0030) is already hand-written SystemVerilog
      (rate_enable_gen.sv, mac_unit.sv, bram_axis_fifo.sv, mr_vla_top.sv).
      Either (a) package it as an RTL IP via `ipx::package_project`, or
      (b) add it to the block design as an RTL module reference. Either is fine.
    step_3_create_block_design: |
      create_project -part xcvc1902-vsva2197-2MP-e-S
      set_property ip_repo_paths {<4 exported HLS IP dirs> <scheduler IP dir>} [current_project]
      update_ip_catalog
      create_bd_design "mr_vla_bd"
      Add: clk_wiz (250 MHz), proc_sys_reset, the 5 IPs, AXIS interconnect /
      AXIS data-width converters as needed for cross-rate FIFO crossings.
      Connect per the T0031 hierarchy:
        vit_encoder_12layer -> xmod_attn_v1 -> action_diff_head
        gvsa_matmul feeds the language KV path into xmod_attn_v1
        multi_rate_scheduler drives the 3 rate enables + AXIS FIFO control
      Expose a lightweight AXI-Lite control port (PS bridge can be a stub
      slave for this synth-only run).
    step_4_synth_impl: |
      Generate HDL wrapper, then:
        launch_runs synth_1 -jobs 1     (single-thread; avoids the v1 helper race)
        wait_on_run synth_1
        open_run synth_1; report_utilization; report_timing_summary
      If host RAM allows, also:
        launch_runs impl_1 -to_step route_design -jobs 1
        wait_on_run impl_1
        open_run impl_1; report_utilization; report_timing_summary
  target_part: xcvc1902-vsva2197-2MP-e-S
  clock_period_ns: 4.0
acceptance_criteria:
  - status: "== DONE"
  - result.synth_ok: true
  - result.timing_met: true
  - result.wns_ns: ">= 0"
  - result.lut_pct: "< 80"
  - result.dsp_pct: "< 85"
  - result.bram_pct: "< 75"
  - result.uram_pct: "< 85"
human_ack_required_on:
  - lut_pct_above_70
  - dsp_pct_above_80
  - wns_below_0_2
  - synth_completed_but_impl_skipped
  - vivado_crash_again
notes: |
  Camera-ready headline result. The integrated post-synth report replaces the
  current [HLS-EST] sum-of-components projection (461 DSP / 82.4k LUT / 47 BRAM
  / 79 URAM) in paper Table V with a measured [HW-EST] integrated number.

  Resource budget sanity check from the accepted T0031 projection: expect
  ~23% DSP, ~9% LUT, ~17% URAM — design should fit VCK190 with wide margin,
  so synth_ok failure would indicate a flow/connectivity bug, not a capacity
  problem.

  If Vivado crashes AGAIN despite the IP-Integrator flow: this strongly
  implicates the 16 GB host RAM. In that case, fall back to bottom-up DCP
  linking (synth each IP out-of-context to a .dcp, then read_checkpoint -cell
  into a black-boxed top) and report which path produced the numbers. Set
  human_ack on vivado_crash_again either way.

  If post-synth timing fails at 250 MHz: drop to 200 MHz, re-run, document in
  §V.A as [HW-EST PARTIAL]. Post-route (impl_1) is a stretch goal — if the
  host cannot complete routing, synth-only numbers are acceptable for the
  current draft; flag synth_completed_but_impl_skipped.
