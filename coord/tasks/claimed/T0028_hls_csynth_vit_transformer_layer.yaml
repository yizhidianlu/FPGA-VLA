params:
  module_name: vit_transformer_layer
  description: |
    One full ViT transformer block (Multi-Head Self-Attention + FFN), PL-only.
    Building block for DinoSigLIP-S vision encoder integration (per user
    decision 2026-05-19: PL-only as transitional + future AIE ablation).

    Layer config (DinoSigLIP-S compatible):
      Input:    [256 patches, 384 dim] INT8 activations
      Head config: 6 heads x 64 dim each
      FFN:      384 → 1536 (hidden) → 384 expand-collapse
      Output:   [256 patches, 384 dim] INT8

    Architecture choices (Claude picks):
      MHA:
        - 256x256 attention matrix (intra-patch attention)
        - reuse T0024's xmod_attn_v1 sparse pattern? No — vision-vision is DENSE
          (per ReconVLA [D13] — within-modal dispersed, not sparse)
        - implement as dense systolic matmul
      FFN:
        - linear 384->1536 (256x384x1536 matmul)
        - GeLU activation (HLS approximation)
        - linear 1536->384

    Pragmas:
      #pragma HLS DATAFLOW between MHA → FFN stages
      #pragma HLS PIPELINE II=1 on inner MAC loops
      #pragma HLS ARRAY_PARTITION cyclic factor=16 on weights
      INT8 throughout

  target_part: xcvc1902-vsva2197-2MP-e-S
  clock_period_ns: 4.0
  resource_caps:
    latency_max: 100000     # one layer; full encoder = 12 × this
    dsp_max: 480            # MHA QKV+output + FFN expand+collapse
    lut_max: 80000
    bram_max: 96
    ii_max: 1
