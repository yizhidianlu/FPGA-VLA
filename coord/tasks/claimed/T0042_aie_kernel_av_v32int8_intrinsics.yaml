  If specific signature is missing, the fallback strategies in the
  quickstart (a/b/c) all preserve algorithmic correctness.

  Tile count: T0041 v1.1 used 2 tiles (one per kernel). Vectorising kernel_av
  should NOT change that — vector ops use the same tile's vector ALU, not
