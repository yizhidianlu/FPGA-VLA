type: vivado_synth
priority: P1
depends_on: [T0030]
deadline_minutes: 180
params:
  module_name: rate_domain_variants
  description: |
    **The H1 quantitative evidence — three rate-domain bitstream variants.**
    T0030 already delivered the MULTI-rate scheduler (single PLL + 3 sub-rate
    enables). H1 also needs the SINGLE-rate and DUAL-rate comparison points so
    the paper can report the multi-rate idle-utilisation / activity advantage.

    Produce three top-level synthesis variants on xcvc1902, all reusing the
    T0030 datapath (rate_enable_gen + mac_unit + bram_axis_fifo + mr_vla_top):

      variant_single : ALL three modality pipelines clocked at the fast
                       100 Hz-equivalent domain (no rate gating). The
                       rate_enable lines are tied high. This is the
                       "GPU-style pay-the-fastest-stream-cost" baseline.
      variant_dual   : vision+language share one gated domain, action keeps
                       its own. Two enables instead of three.
      variant_multi  : the T0030 result (single PLL + 3 enables) — re-use the
                       existing T0030 netlist/reports, no re-synth needed.

  flow:
    step_1: |
      For variant_single and variant_dual, edit mr_vla_top.sv's rate_enable
      wiring only (T0030's modules are unchanged) and synthesize OOC at
      250 MHz: synth_design -mode out_of_context -part xcvc1902-vsva2197-2MP-e-S.
    step_2: |
      For EACH of the three variants run report_power with a representative
      switching-activity assumption (default 12.5% toggle, or a SAIF if one
      can be produced quickly). Record total + dynamic power.
    step_3: |
      Compute the idle-utilisation / activity-factor gap:
      multi-rate gates vision to 30 Hz and language to 1 Hz, so its
      average datapath activity is far below single-rate. Report the
      effective-activity ratio multi-vs-single; H1 expects >= 40% gap.
  target_part: xcvc1902-vsva2197-2MP-e-S
  clock_period_ns: 4.0
acceptance_criteria:
  - status: "== DONE"
  - result.synth_ok: true
  - result.variant_single_synth: true
  - result.variant_dual_synth: true
  - result.timing_met: true
human_ack_required_on:
  - idle_util_gap_below_40
  - wns_below_0_2
notes: |
  Feeds paper H1 verdict and the rate axis of the 27-cell ablation. The
  idle-utilisation gap is the H1 falsification metric (>= 40% required).
  If report_power activity modelling is not feasible on this host, report the
  static resource + clock-enable duty-cycle ratio instead and flag it
  human_ack(idle_util_gap_below_40) so the orchestrator can decide whether a
  duty-cycle proxy is acceptable for the paper.
