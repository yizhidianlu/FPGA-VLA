params:
  module_name: xmod_attn_v0
  description: |
    Cross-modal sparse attention engine v0 — C2 contribution of MR-VLA.

    Architecture (per paper §III.C):
      Input:  Q (1 x 4096 INT8) — current action token query
              K (256 x 4096 INT8) — vision token keys (from AIE)
              V (256 x 4096 INT8) — vision token values (from AIE)
      Step 1: Compute Q·K^T -> 256 scores (1 x 256)
      Step 2: Top-K=64 selection on scores (REUSES topk_engine from T0020)
      Step 3: Softmax over the 64 selected scores
      Step 4: Weighted sum V[selected] -> output (1 x 4096 INT8)

    Tier-0 evidence supports k=64 design (99.99% of measurements pass
    top-64 ≥ 0.80 mass coverage on base OpenVLA; 98.75% on fine-tuned).
    Therefore this IP commits to k=64 with INT8 precision.

  target_part_primary: xcvc1902-vsva2197-2MP-e-S
  target_part_fallback: xczu9eg-ffvb1156-2-e
  clock_period_ns: 4.0

  resource_caps:   # per EXPERIMENT_MASTER_PLAN §3 (DA-INC-2 resolution: 19% DSP)
    dsp_max: 600       # ~19% of VCK190's 1968 DSPs (or ~25% of ZCU102's 2520)
    bram_max: 200
    lut_max: 80000     # ~9% of VCK190's 900K LUTs
    ii_max: 8

acceptance_criteria:
  - status: "== DONE"
  - result.csim_pass: true
  - result.csynth_pass: true
  - result.dsp_used: "< 600"
  - result.lut_used: "< 80000"
  - result.ii: "<= 8"
human_ack_required_on:
