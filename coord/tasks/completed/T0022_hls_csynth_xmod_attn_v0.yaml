  - csim_pass: false
notes: |
  PRIMARY GOAL: get [HLS-EST] LUT/DSP/BRAM numbers for the centerpiece IP
  of MR-VLA. These numbers feed into paper Table V (resource utilization).

  REUSE T0020's topk_engine: instantiate it as a submodule.

  Source files to write under runs/T0022/:
    - xmod_attn_v0.cpp (top function)
    - q_kt_matmul.cpp  (Q.K^T computation, INT8 systolic-like)
    - softmax_64.cpp   (softmax over 64 elements)
    - weighted_sum.cpp (V weighted sum)
    - xmod_attn_v0_tb.cpp (testbench: feed 5 OpenVLA-style golden tensors,
                            verify output vs python reference)
    - run_hls.tcl

  Testbench golden data:
    - Generate 5 random (Q, K, V) sets in python
    - Run python reference: scores = Q @ K.T; top_idx = scores.argsort()[-64:];
      attn = softmax(scores[top_idx]); out = attn @ V[top_idx]
    - Save as .h files with const arrays
    - HLS testbench loads, runs xmod_attn_v0, compares with cosine sim > 0.99

  In result.json include:
    csim_pass, csynth_pass, csim_cosine_sim (vs python golden)
    latency_cycles (Q.K^T + topk + softmax + weighted_sum total)
    ii, dsp_used, bram_used, lut_used, ff_used
    target_part_used
    breakdown_by_submodule: {q_kt: {dsp, lut}, topk: {dsp, lut}, softmax: {dsp, lut}, weighted_sum: {dsp, lut}}

  Copy synth_util.rpt + schedule.rpt to coord/reports/T0022/.
